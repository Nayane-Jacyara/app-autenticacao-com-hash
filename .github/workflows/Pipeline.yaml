name: CI/CD - Deploy Flask App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest  # Você pode mudar para a plataforma de sua preferência

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install Docker
      run: |
        sudo apt-get update
        sudo apt-get install -y docker.io

    - name: Build Docker image
      run: |
        docker build -t flask-app .  # Construa a imagem do Docker usando o Dockerfile no repositório

    - name: Run Docker container
      run: |
        docker run -d -p 5000:5000 flask-app  # Executa o contêiner Flask

    - name: Wait for the application to start
      run: |
        sleep 20  # Aguarda a aplicação subir

    - name: Verify if the Flask app is running
      run: |
        curl -f http://localhost:5000 || exit 1  # Verifica se a aplicação está respondendo
